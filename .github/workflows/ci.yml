name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.12"]
        include:
          # macOS on 3.11 only: the failures we are guarding against are
          # platform-specific (hostname resolution, /tmp -> /private/tmp
          # symlink resolution), not version-specific, so one runner buys
          # the same signal for a third of the CI minutes.
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[image,dev]'

      - name: Compile check
        run: python -m compileall -q golive/

      - name: Run tests
        # --timeout-method=signal (not thread) can interrupt a test blocked
        # in a C-level syscall (e.g. a socket waiting on reverse DNS), which
        # is exactly the class of hang that shows up only on CI runners.
        # On timeout pytest dumps the stack so we see which test hung, and
        # the job fails in ~45s instead of holding the runner for hours.
        run: python -m pytest tests/ -q --timeout=45 --timeout-method=signal --durations=10

  # A separate job rather than another matrix entry: the Postgres suite is
  # skipped without a DSN, and until this existed that meant 45 tests never
  # ran anywhere. Ten Postgres bugs shipped in 0.7.7 for exactly that reason
  # — the backend was only ever exercised by hand. Keeping it separate also
  # means a Postgres failure is legible as one, instead of turning a cell of
  # the main matrix red for an unrelated-looking reason.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: golive
          POSTGRES_PASSWORD: golive_ci
          POSTGRES_DB: golive_test
        ports:
          - 5432:5432
        # Without the health check the job races the container: psycopg
        # connects before Postgres finishes initialising and every test
        # errors on connection rather than on anything it is testing.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[image,dev,postgres]'

      - name: Run the Postgres suite
        env:
          GOLIVE_PG_DSN: postgresql://golive:golive_ci@127.0.0.1:5432/golive_test
        run: |
          python -m pytest tests/test_postgres_backend.py tests/test_data_layer_e2e.py \
            -q --timeout=60 --timeout-method=signal -rs

      - name: Assert the suite actually ran
        # The tests skip themselves when the DSN is missing, so a green run
        # proves nothing on its own — a typo in the env name above would give
        # a passing job with everything skipped, which is the failure this
        # whole job exists to prevent. Require a real count of passes.
        env:
          GOLIVE_PG_DSN: postgresql://golive:golive_ci@127.0.0.1:5432/golive_test
        run: |
          python -m pytest tests/test_postgres_backend.py -q --timeout=60 \
            --timeout-method=signal > pg.txt 2>&1 || true
          tail -3 pg.txt
          python - <<'EOF'
          import re, sys
          report = open("pg.txt", encoding="utf-8").read()
          passed = int((re.search(r"(\d+) passed", report) or [0, 0])[1])
          skipped = int((re.search(r"(\d+) skipped", report) or [0, 0])[1])
          print(f"passed={passed} skipped={skipped}")
          if passed < 20:
              sys.exit(f"expected the Postgres suite to run, got {passed} "
                       f"passed / {skipped} skipped — is GOLIVE_PG_DSN set?")
          EOF

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify wheel contents
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          css = [n for n in names if "css_styles" in n and n.endswith(".css")]
          assert len(css) == 19, f"expected 19 css styles in wheel, got {len(css)}"
          assert any(n.endswith("rules.yaml") for n in names), "rules.yaml missing"
          assert not any("__pycache__" in n for n in names), "pycache leaked"
          print(f"wheel OK: {len(names)} files, {len(css)} css styles")
          EOF

      - name: Smoke test from wheel
        run: |
          pip install dist/*.whl
          export GOLIVE_HOME="$RUNNER_TEMP/golive-home"
          echo '<html><body><h1>ci</h1></body></html>' > "$RUNNER_TEMP/ci.html"
          golive publish "$RUNNER_TEMP/ci.html" --slug ci
          golive list
          golive doctor
          golive doctor --json > "$RUNNER_TEMP/doctor.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['ok'], d['problems']; assert d['registry']['sites'] >= 1" "$RUNNER_TEMP/doctor.json"

      - name: Smoke test the background service
        run: |
          export GOLIVE_HOME="$RUNNER_TEMP/golive-home"
          golive serve start --port 8788
          golive serve status
          curl -fsS http://127.0.0.1:8788/health
          curl -fsS http://127.0.0.1:8788/ci | grep -q '<h1>ci</h1>'
          # doctor must see the running service and agree on the version
          golive doctor --port 8788 --json > "$RUNNER_TEMP/doctor-live.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); s=d['service']; assert s['running'], s; assert s['version_match'], s" "$RUNNER_TEMP/doctor-live.json"
          golive serve restart
          golive serve logs -n 20
          golive serve stop
          golive serve status || echo "stopped as expected (exit 1)"
