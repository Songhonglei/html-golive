# golive.yaml — configuration example
#
# Everything is optional: with no config file golive runs in zero-config
# mode (local storage + SQLite registry + built-in server).
#
# Config file lookup order:
#   1. --config <path>
#   2. ./golive.yaml
#   3. $GOLIVE_HOME/golive.yaml

# ── storage backend ──────────────────────────────────────────────────────────
storage:
  backend: local          # local (v0.1) | s3 (coming in M2)
  # s3:                   # coming in M2
  #   endpoint: https://s3.example.com
  #   bucket: golive-sites
  #   access_key_env: GOLIVE_S3_AK
  #   secret_key_env: GOLIVE_S3_SK

# ── registry backend ─────────────────────────────────────────────────────────
registry:
  backend: sqlite         # sqlite (v0.1) | postgres (M2) | supabase (M2)
  # supabase:             # coming in M2
  #   url: https://xyz.supabase.co
  #   anon_key_env: GOLIVE_SUPABASE_ANON_KEY

# ── data layer (window.TemplateAPI / window.SupabaseAPI) ────────────────────
data:
  backend: none           # none (v0.1) | supabase (coming in M2)

# ── CSS style fonts ──────────────────────────────────────────────────────────
style:
  # Replace the https://fonts.googleapis.com prefix in injected CSS styles
  # with a custom mirror (e.g. https://fonts.loli.net or a self-hosted
  # font service). Env GOLIVE_FONT_CDN_BASE takes precedence.
  font_cdn_base: ""       # empty = Google Fonts (default)

# ── image uploader (bundling) ────────────────────────────────────────────────
uploader:
  # Shell command template for uploading bundled images to your own
  # image host. golive writes each image to a temp file, substitutes
  # {file}, runs the command, and takes the last stdout line as the URL.
  # On failure the image silently falls back to base64 inlining.
  # Env GOLIVE_UPLOADER_CMD takes precedence.
  # Examples:
  #   command: "mytool upload {file}"
  #   command: "aws s3 cp {file} s3://bucket/img/ --acl public-read && echo https://cdn.example.com/img/{name}"
  command: ""             # empty = base64 inline (default)
  # s3:                   # native S3 uploader — coming in M2

# ── auth (serve-mode write ops & /api/sites) ────────────────────────────────
auth:
  provider: none          # none | token   (oauth coming in M3)
  # token: ""             # or set env GOLIVE_TOKEN

# ── server ───────────────────────────────────────────────────────────────────
server:
  host: 0.0.0.0
  port: 8787

# ── slug rules ───────────────────────────────────────────────────────────────
slug:
  reserved: []            # extra reserved slugs, e.g. [internal, beta]

# ── resource localization ────────────────────────────────────────────────────
localize:
  never: []               # extra never-localize domains

# ── security scanning ────────────────────────────────────────────────────────
security:
  extra_rules: []         # extra rule YAML files, same schema as built-in
  # llm:                  # optional AI review — coming in M3
  #   base_url: https://api.openai.com/v1
  #   api_key_env: GOLIVE_LLM_KEY
  #   model: gpt-4o-mini
