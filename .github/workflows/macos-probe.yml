name: macOS service probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[image,dev]'
      - name: Probe the child process directly
        run: |
          python - <<'PY'
          import os, socket, subprocess, sys, time, tempfile, json
          home = tempfile.mkdtemp()
          os.environ["GOLIVE_HOME"] = home

          s = socket.socket(); s.bind(("127.0.0.1", 0))
          port = s.getsockname()[1]; s.close()

          # Exactly what service._spawn does, but with the child's output
          # captured to a pipe so we can actually see what it says.
          cmd = [sys.executable, "-m", "golive.cli",
                 "serve", "--port", str(port), "--host", "127.0.0.1"]
          env = dict(os.environ)
          env["PYTHONUNBUFFERED"] = "1"
          print("cmd:", cmd)
          print("cwd:", os.getcwd())

          proc = subprocess.Popen(cmd, stdout=subprocess.PIPE,
                                  stderr=subprocess.STDOUT,
                                  stdin=subprocess.DEVNULL,
                                  env=env, text=True,
                                  start_new_session=True)
          time.sleep(6)
          rc = proc.poll()
          print("poll after 6s:", rc)

          import urllib.request, urllib.error
          try:
              r = urllib.request.urlopen(
                  f"http://127.0.0.1:{port}/health", timeout=3)
              print("HEALTH OK:", r.read()[:200])
          except Exception as e:
              print("HEALTH FAILED:", type(e).__name__, e)

          proc.terminate()
          try:
              out = proc.communicate(timeout=10)[0]
          except subprocess.TimeoutExpired:
              proc.kill(); out = proc.communicate()[0]
          print("--- child output ---")
          print(out or "(nothing at all)")

          # Is the module even importable the way the child invokes it?
          probe = subprocess.run(
              [sys.executable, "-c", "import golive; print(golive.__file__)"],
              capture_output=True, text=True, env=env)
          print("import probe rc:", probe.returncode)
          print("stdout:", probe.stdout.strip())
          print("stderr:", probe.stderr.strip()[:500])
          PY
