[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "html-golive"
version = "0.9.3"
description = "Self-hosted one-command HTML deployment — Vercel-lite for your intranet."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Songhonglei" }]
keywords = ["html", "deploy", "static-site", "self-hosted", "intranet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.9",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
image = ["Pillow>=9.0"]
s3 = ["boto3>=1.26"]
oidc = ["cryptography>=41.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7.0", "pytest-timeout>=2.1", "cryptography>=41.0"]

[project.urls]
Homepage = "https://github.com/Songhonglei/html-golive"
Issues = "https://github.com/Songhonglei/html-golive/issues"

[project.scripts]
golive = "golive.cli:main"

[tool.setuptools.packages.find]
include = ["golive*"]

[tool.setuptools.package-data]
"golive" = [
    "resources/css_styles/*.css",
    "resources/demo/*.html",
    "resources/skill/SKILL.md",
    "resources/skill/references/*.md",
]
"golive.security" = ["rules.yaml"]

# Test assets ship in the sdist so `pip download html-golive && pytest` works
# from the archive alone. The wheel stays runtime-only: these files import
# nothing the package needs at run time, and an install should not carry its
# own audit fixtures. tests/__init__.py must be listed explicitly — without a
# package-level include for `tests`, setuptools omits it and every module
# doing `from tests.fake_postgrest import ...` fails to collect (external
# audit of 0.9.2: three helper files missing, suite not collectable).
[tool.setuptools]
include-package-data = true

[tool.setuptools.data-files]
"tests" = [
    "tests/__init__.py",
    "tests/fake_idp.py",
    "tests/fake_postgrest.py",
]
"tests/corpus" = ["tests/corpus/README.md"]
"tests/corpus/must_block" = ["tests/corpus/must_block/*.html"]
"tests/corpus/must_pass" = ["tests/corpus/must_pass/*.html"]
"docs" = [
    "docs/*.md",
    "docs/*.html",
    "docs/assets/*",
]
"." = ["CHANGELOG.md", "README.zh-CN.md", "golive.example.yaml"]
