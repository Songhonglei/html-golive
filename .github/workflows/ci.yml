name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.12"]
        include:
          # macOS on 3.11 only: the failures we are guarding against are
          # platform-specific (hostname resolution, /tmp -> /private/tmp
          # symlink resolution), not version-specific, so one runner buys
          # the same signal for a third of the CI minutes.
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[image,dev]'

      - name: Compile check
        run: python -m compileall -q golive/

      - name: Run tests
        # --timeout kills any single test that hangs (e.g. a socket that
        # blocks on reverse DNS) so a stuck test fails loudly in ~1min
        # instead of holding the whole job to the 6h GitHub ceiling.
        run: python -m pytest tests/ -q --timeout=60 --timeout-method=thread

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify wheel contents
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          css = [n for n in names if "css_styles" in n and n.endswith(".css")]
          assert len(css) == 19, f"expected 19 css styles in wheel, got {len(css)}"
          assert any(n.endswith("rules.yaml") for n in names), "rules.yaml missing"
          assert not any("__pycache__" in n for n in names), "pycache leaked"
          print(f"wheel OK: {len(names)} files, {len(css)} css styles")
          EOF

      - name: Smoke test from wheel
        run: |
          pip install dist/*.whl
          export GOLIVE_HOME="$RUNNER_TEMP/golive-home"
          echo '<html><body><h1>ci</h1></body></html>' > "$RUNNER_TEMP/ci.html"
          golive publish "$RUNNER_TEMP/ci.html" --slug ci
          golive list
          golive doctor
          golive doctor --json > "$RUNNER_TEMP/doctor.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['ok'], d['problems']; assert d['registry']['sites'] >= 1" "$RUNNER_TEMP/doctor.json"

      - name: Smoke test the background service
        run: |
          export GOLIVE_HOME="$RUNNER_TEMP/golive-home"
          golive serve start --port 8788
          golive serve status
          curl -fsS http://127.0.0.1:8788/health
          curl -fsS http://127.0.0.1:8788/ci | grep -q '<h1>ci</h1>'
          # doctor must see the running service and agree on the version
          golive doctor --port 8788 --json > "$RUNNER_TEMP/doctor-live.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); s=d['service']; assert s['running'], s; assert s['version_match'], s" "$RUNNER_TEMP/doctor-live.json"
          golive serve restart
          golive serve logs -n 20
          golive serve stop
          golive serve status || echo "stopped as expected (exit 1)"
