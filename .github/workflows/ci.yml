name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.12"]
        include:
          # macOS on 3.11 only: the failures we are guarding against are
          # platform-specific (hostname resolution, /tmp -> /private/tmp
          # symlink resolution), not version-specific, so one runner buys
          # the same signal for a third of the CI minutes.
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[image,dev]'

      - name: Compile check
        run: python -m compileall -q golive/

      - name: Run tests
        # --timeout-method=signal (not thread) can interrupt a test blocked
        # in a C-level syscall (e.g. a socket waiting on reverse DNS), which
        # is exactly the class of hang that shows up only on CI runners.
        # On timeout pytest dumps the stack so we see which test hung, and
        # the job fails in ~45s instead of holding the runner for hours.
        run: python -m pytest tests/ -q --timeout=45 --timeout-method=signal --durations=10

  # A separate job rather than another matrix entry: the Postgres suite is
  # skipped without a DSN, and until this existed that meant 45 tests never
  # ran anywhere. Ten Postgres bugs shipped in 0.7.7 for exactly that reason
  # — the backend was only ever exercised by hand. Keeping it separate also
  # means a Postgres failure is legible as one, instead of turning a cell of
  # the main matrix red for an unrelated-looking reason.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: golive
          POSTGRES_PASSWORD: golive_ci
          POSTGRES_DB: golive_test
        ports:
          - 5432:5432
        # Without the health check the job races the container: psycopg
        # connects before Postgres finishes initialising and every test
        # errors on connection rather than on anything it is testing.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[image,dev,postgres]'

      - name: Run the Postgres suite
        env:
          GOLIVE_PG_DSN: postgresql://golive:golive_ci@127.0.0.1:5432/golive_test
        run: |
          python -m pytest tests/test_postgres_backend.py tests/test_data_layer_e2e.py tests/test_sql_backend_contract.py tests/test_backend_http_contract.py \
            -q --timeout=60 --timeout-method=signal -rs

      - name: Assert the suite actually ran
        # The tests skip themselves when the DSN is missing, so a green run
        # proves nothing on its own — a typo in the env name above would give
        # a passing job with everything skipped, which is the failure this
        # whole job exists to prevent. Require a real count of passes.
        env:
          GOLIVE_PG_DSN: postgresql://golive:golive_ci@127.0.0.1:5432/golive_test
        run: |
          python -m pytest tests/test_postgres_backend.py -q --timeout=60 \
            --timeout-method=signal > pg.txt 2>&1 || true
          tail -3 pg.txt
          python - <<'EOF'
          import re, sys
          report = open("pg.txt", encoding="utf-8").read()
          passed = int((re.search(r"(\d+) passed", report) or [0, 0])[1])
          skipped = int((re.search(r"(\d+) skipped", report) or [0, 0])[1])
          print(f"passed={passed} skipped={skipped}")
          if passed < 20:
              sys.exit(f"expected the Postgres suite to run, got {passed} "
                       f"passed / {skipped} skipped — is GOLIVE_PG_DSN set?")
          EOF

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: golive_test
          MYSQL_USER: golive
          MYSQL_PASSWORD: golive_ci
          MYSQL_ROOT_PASSWORD: golive_root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgolive_root_ci --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MySQL dependencies
        run: pip install -e '.[image,dev,mysql,verify]'
      - name: Run real MySQL store and HTTP contracts
        env:
          GOLIVE_MYSQL_DSN: mysql://golive:golive_ci@127.0.0.1:3306/golive_test
        run: |
          python -m pytest tests/test_mysql_config.py tests/test_sql_backend_contract.py \
            tests/test_backend_http_contract.py tests/test_data_layer_e2e.py \
            -q --timeout=45 --junitxml=mysql-results.xml
      - name: Require actual MySQL cases (never accept all-skipped)
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("mysql-results.xml").findall(".//testcase")
          actual = [c for c in cases if "[mysql]" in c.get("name", "")
                    and c.find("skipped") is None]
          assert len(actual) >= 9, f"expected >=9 live MySQL cases, got {len(actual)}"
          assert all(c.find("failure") is None and c.find("error") is None for c in actual)
          print(f"{len(actual)} real MySQL contract cases passed")
          PY

      - name: Install acceptance browser
        run: python -m playwright install --with-deps chromium
      - name: Full MySQL browser and restart acceptance
        env:
          GOLIVE_MYSQL_DSN: mysql://golive:golive_ci@127.0.0.1:3306/golive_test
        run: |
          export GOLIVE_HOME="$RUNNER_TEMP/golive-full-home"
          mkdir -p "$GOLIVE_HOME"
          python - <<'PYCFG'
          import os
          from pathlib import Path
          Path(os.environ["GOLIVE_HOME"], "golive.yaml").write_text(
              "registry:\n  backend: mysql\ndata:\n  backend: mysql\n", encoding="utf-8")
          PYCFG
          golive verify --full --json --report-dir "$RUNNER_TEMP/mysql-full-report"
      - name: Upload full acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-full-acceptance
          path: ${{ runner.temp }}/mysql-full-report
          if-no-files-found: warn

  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: golive_test
          MYSQL_USER: golive
          MYSQL_PASSWORD: golive_ci
          MYSQL_ROOT_PASSWORD: golive_root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgolive_root_ci --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Install all database drivers
        run: pip install -e '.[image,dev,postgres,mysql]'
      - name: Start isolated real Supabase services
        run: |
          export SUPABASE_HOME="$RUNNER_TEMP/golive-supabase-home"
          echo "SUPABASE_HOME=$SUPABASE_HOME" >> "$GITHUB_ENV"
          supabase --workdir "$RUNNER_TEMP/golive-supabase" init --yes
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'golive-supabase/supabase/config.toml'
          source = path.read_text()
          assert '[experimental]' in source
          path.write_text(source.replace('[experimental]', '[experimental]\nstack = true', 1))
          PY
          supabase --workdir "$RUNNER_TEMP/golive-supabase" start \
            --runtime native --stack golive-ci --eager \
            --exclude realtime,functions,studio,mail,analytics,pooler --yes > "$RUNNER_TEMP/supabase-start.log" 2>&1
          umask 077
          supabase --workdir "$RUNNER_TEMP/golive-supabase" stack status \
            --stack golive-ci --output-format json > "$RUNNER_TEMP/supabase-status.json"
      - name: Verify real PostgREST, Storage, RLS and all migration pairs
        env:
          GOLIVE_MYSQL_DSN: mysql://golive:golive_ci@127.0.0.1:3306/golive_test
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          status = json.loads((Path(os.environ['RUNNER_TEMP']) / 'supabase-status.json').read_text())
          assert status['readiness'] == 'ready'
          settings = status['env']
          for name in ('PUBLISHABLE_KEY', 'SECRET_KEY', 'ANON_KEY', 'SERVICE_ROLE_KEY', 'DB_URL'):
              print('::add-mask::' + settings[name], flush=True)
          env = os.environ.copy()
          for target, source in [('URL', 'API_URL'), ('DB_DSN', 'DB_URL'),
                                 ('ANON_KEY', 'PUBLISHABLE_KEY'), ('SERVICE_KEY', 'SECRET_KEY')]:
              env['GOLIVE_TEST_SUPABASE_' + target] = settings[source]
          # PostgreSQL and PostgREST must not address the same source table.
          import psycopg
          from psycopg.conninfo import make_conninfo
          with psycopg.connect(settings['DB_URL'], autocommit=True) as db:
              db.execute('CREATE DATABASE golive_sql_acceptance')
          env['GOLIVE_PG_DSN'] = make_conninfo(settings['DB_URL'], dbname='golive_sql_acceptance')
          result = subprocess.run([sys.executable, '-m', 'pytest', 'tests/test_supabase_live.py',
                                   'tests/test_sql_backend_migration.py', '-q', '--tb=short',
                                   '--timeout=60', '--junitxml=supabase-results.xml'], env=env)
          sys.exit(result.returncode)
          PY
      - name: Require every live Supabase case
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('supabase-results.xml').findall('.//testcase')
          live = [c for c in cases if c.get('classname', '').endswith('test_supabase_live')]
          assert len(live) == 6 and all(c.find('skipped') is None for c in live)
          assert all(c.find('failure') is None and c.find('error') is None for c in live)
          PY
      - name: Stop only this test stack
        if: always()
        run: supabase --workdir "$RUNNER_TEMP/golive-supabase" stack stop --stack golive-ci

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify wheel contents
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          css = [n for n in names if "css_styles" in n and n.endswith(".css")]
          assert len(css) == 19, f"expected 19 css styles in wheel, got {len(css)}"
          assert any(n.endswith("rules.yaml") for n in names), "rules.yaml missing"
          assert not any("__pycache__" in n for n in names), "pycache leaked"
          print(f"wheel OK: {len(names)} files, {len(css)} css styles")
          EOF

      - name: Smoke test from wheel
        run: |
          pip install dist/*.whl
          export GOLIVE_HOME="$RUNNER_TEMP/golive-home"
          echo '<html><body><h1>ci</h1></body></html>' > "$RUNNER_TEMP/ci.html"
          golive publish "$RUNNER_TEMP/ci.html" --slug ci
          golive list
          golive doctor
          golive doctor --json > "$RUNNER_TEMP/doctor.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['ok'], d['problems']; assert d['registry']['sites'] >= 1" "$RUNNER_TEMP/doctor.json"

      - name: Smoke test the background service
        run: |
          export GOLIVE_HOME="$RUNNER_TEMP/golive-home"
          golive serve start --port 8788
          golive serve status
          curl -fsS http://127.0.0.1:8788/health
          curl -fsS http://127.0.0.1:8788/ci | grep -q '<h1>ci</h1>'
          # doctor must see the running service and agree on the version
          golive doctor --port 8788 --json > "$RUNNER_TEMP/doctor-live.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); s=d['service']; assert s['running'], s; assert s['version_match'], s" "$RUNNER_TEMP/doctor-live.json"
          golive serve restart
          golive serve logs -n 20
          golive serve stop
          golive serve status || echo "stopped as expected (exit 1)"
