name: macOS service probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[image,dev]'
      - name: What does the child actually do
        run: |
          python - <<'PY'
          import os, socket, subprocess, sys, tempfile, time

          home = tempfile.mkdtemp()
          os.environ["GOLIVE_HOME"] = home
          print("HOME given :", home)
          print("HOME resolved:", os.path.realpath(home))

          s = socket.socket(); s.bind(("127.0.0.1", 0))
          port = s.getsockname()[1]; s.close()

          # Run the child in the FOREGROUND with output straight to us.
          # No pipes, no detaching, no log file — just show me the truth.
          cmd = [sys.executable, "-u", "-m", "golive.cli",
                 "serve", "--port", str(port), "--host", "127.0.0.1"]
          env = dict(os.environ); env["PYTHONUNBUFFERED"] = "1"

          print("=== running child for 8s ===", flush=True)
          proc = subprocess.Popen(cmd, env=env, text=True,
                                  stdout=subprocess.PIPE,
                                  stderr=subprocess.STDOUT,
                                  bufsize=1)
          deadline = time.time() + 8
          lines = []
          import threading
          def pump():
              for ln in proc.stdout:
                  lines.append(ln.rstrip())
                  print("CHILD |", ln.rstrip(), flush=True)
          t = threading.Thread(target=pump, daemon=True); t.start()
          while time.time() < deadline and proc.poll() is None:
              time.sleep(0.3)
          print("=== poll:", proc.poll(), "lines seen:", len(lines), flush=True)

          try:
              import urllib.request
              r = urllib.request.urlopen(
                  f"http://127.0.0.1:{port}/health", timeout=3)
              print("HEALTH OK:", r.read()[:200])
          except Exception as e:
              print("HEALTH FAILED:", type(e).__name__, e)

          proc.terminate()
          time.sleep(1)
          proc.kill()

          # Where does the child think its home is?
          print("=== child's view of paths ===", flush=True)
          probe = subprocess.run(
              [sys.executable, "-c",
               "from golive.core.paths import get_home;"
               "print('get_home:', get_home());"
               "import golive.config as c; cfg=c.get_config();"
               "print('data backend:', cfg.data.backend)"],
              capture_output=True, text=True, env=env)
          print("rc:", probe.returncode)
          print("stdout:", probe.stdout)
          print("stderr:", probe.stderr[-1500:])
          PY
