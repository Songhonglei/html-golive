# golive.yaml — configuration example
#
# Everything is optional: with no config file golive runs in zero-config
# mode (local storage + SQLite registry + built-in server).
#
# Config file lookup order:
#   1. golive --config <path>
#   2. $GOLIVE_CONFIG
#   3. ./golive.yaml
#   4. $GOLIVE_HOME/golive.yaml
#
# Environment variables always override yaml (12-factor). Secrets never
# live in this file: yaml stores the *name* of an env var (…_env keys)
# and the value is read from the environment at runtime.

# ── shared Supabase connection ───────────────────────────────────────────────
# One Supabase project can host all three layers (storage + registry + data).
# Keys: set GOLIVE_SUPABASE_ANON_KEY / GOLIVE_SUPABASE_SERVICE_KEY in env,
# or point *_env at your own variable names.
supabase:
  url: ""                 # e.g. https://abcdefg.supabase.co  (or env GOLIVE_SUPABASE_URL)
  anon_key_env: GOLIVE_SUPABASE_ANON_KEY
  service_key_env: GOLIVE_SUPABASE_SERVICE_KEY

# ── storage backend (published site HTML) ────────────────────────────────────
storage:
  backend: local          # local | s3 | supabase
  # s3:                   # any S3-compatible store (MinIO / COS / OSS / TOS / AWS)
  #   endpoint: https://s3.example.com     # empty = AWS default endpoints
  #   bucket: golive-sites
  #   prefix: ""                            # optional key prefix
  #   region: ""                            # e.g. us-east-1
  #   access_key_env: GOLIVE_S3_AK
  #   secret_key_env: GOLIVE_S3_SK
  #   public_base: ""                       # optional public/CDN URL prefix
  # supabase:
  #   bucket: golive-sites                  # Supabase Storage bucket name

# ── registry backend (site metadata) ─────────────────────────────────────────
registry:
  backend: sqlite         # sqlite | supabase
  # supabase:
  #   table: golive_sites  # see `golive db init --print-sql` for the schema

# ── data layer (window.TemplateAPI / window.SupabaseAPI injection) ───────────
data:
  # sqlite   — default. Rows live in $GOLIVE_HOME/data.db; the table is
  #            created on first use and published pages read/write it
  #            through golive serve's /api/data endpoint. No key is
  #            embedded in the HTML, and no external service is needed.
  #            Anyone who can reach the server can call that endpoint —
  #            front it with GOLIVE_TOKEN / OIDC / a proxy if the data
  #            is sensitive.
  # supabase — rows live in your Supabase project; pages call PostgREST
  #            directly with the anon key embedded in the HTML, so RLS
  #            policies are mandatory. Use this to share one dataset
  #            across machines or to host pages outside golive.
  # none     — data layer disabled; TemplateAPI is injected as a stub
  #            that rejects every call with a configuration hint.
  backend: sqlite         # sqlite | supabase | none
  # sqlite:
  #   path: ""            # override the data.db location
  # api_base: ""          # absolute /api/data URL when pages are served
  #                       # from a different origin than golive serve
  # supabase:
  #   templates_table: golive_templates    # TemplateAPI storage table
  #   user_id: ""                           # identity stamped on created rows

# ── CSS style fonts ──────────────────────────────────────────────────────────
style:
  # Replace the https://fonts.googleapis.com prefix in injected CSS styles
  # with a custom mirror (e.g. https://fonts.loli.net or a self-hosted
  # font service). Env GOLIVE_FONT_CDN_BASE takes precedence.
  font_cdn_base: ""       # empty = Google Fonts (default)

# ── image uploader (bundling) ────────────────────────────────────────────────
uploader:
  # Option 1 — shell command template ({file} → temp path, {name} → filename;
  # last stdout line that looks like a URL is used). Env GOLIVE_UPLOADER_CMD wins.
  command: ""             # empty = base64 inline (default)
  # Option 2 — native S3 uploader (pip install 'html-golive[s3]')
  # s3:
  #   endpoint: https://s3.example.com
  #   bucket: golive-img
  #   prefix: img/
  #   region: ""
  #   access_key_env: GOLIVE_S3_AK
  #   secret_key_env: GOLIVE_S3_SK
  #   public_base: https://cdn.example.com  # URL prefix returned to pages

# ── auth (serve-mode write ops & /api/sites) ────────────────────────────────
auth:
  provider: none          # none | token | oidc
  # token: ""             # prefer env GOLIVE_TOKEN over writing it here

  # ── generic OIDC (M3) — Google / Keycloak / Authentik / any IdP with a
  #    discovery document. client_secret NEVER lives here: set the env var
  #    named by client_secret_env (default GOLIVE_OIDC_CLIENT_SECRET).
  # oidc:
  #   # ── Quickest: use a preset (fills issuer + scopes for you) ──────
  #   #   preset: google        # then only client_id + secret env needed
  #   #   preset: auth0         # + domain: your-tenant.us.auth0.com
  #   #   preset: okta          # + domain: your-org.okta.com
  #   #   preset: azure         # + tenant: <tenant-id> | organizations | common
  #   #   preset: keycloak      # + your own issuer: (preset only sets scopes)
  #   #   preset: authentik     # + your own issuer:
  #   # client_id: golive
  #   #
  #   # ── Or configure fully by hand ─────────────────────────────────
  #   # Example A — Google
  #   issuer: https://accounts.google.com
  #   client_id: 1234567890-abc.apps.googleusercontent.com
  #   client_secret_env: GOLIVE_OIDC_CLIENT_SECRET
  #   redirect_uri: https://pages.example.com/auth/callback
  #
  #   # Example B — Keycloak (self-hosted)
  #   # issuer: https://keycloak.example.com/realms/myrealm
  #   # client_id: golive
  #   # redirect_uri: http://localhost:8787/auth/callback
  #
  #   # Example C — GitHub (via an OIDC bridge like Dex — GitHub's own
  #   # OAuth is not OIDC; point issuer at your Dex/Authentik instance
  #   # with a GitHub connector)
  #   # issuer: https://dex.example.com
  #   # client_id: golive
  #   # redirect_uri: http://localhost:8787/auth/callback
  #
  #   scopes: "openid email profile"
  #   session_ttl: 28800                       # seconds (default 8h)
  #   cookie_secret_env: GOLIVE_COOKIE_SECRET  # HMAC key for session cookies
  #   force_secure_cookie: false               # true when always behind TLS

# ── online editor (M3) ───────────────────────────────────────────────────────
# Per-site opt-in: golive publish <file> --enable-editor
# Save requests need a token (editor.token > auth.token > rejected) AND the
# claimed identity must be the site owner / a maintainer (when set).
editor:
  token: ""               # prefer env GOLIVE_EDITOR_TOKEN over writing it here

# ── watermark (M3) ───────────────────────────────────────────────────────────
# Identity: OIDC user (auth.provider: oidc) > text below / --watermark <text>
# > <meta name="golive-watermark" content="..."> in the page.
# GOLIVE_WATERMARK_OFF=1 disables globally (debug).
watermark:
  enabled: false          # true = watermark every publish (or use --watermark)
  text: ""                # static fallback text, e.g. CONFIDENTIAL
  opacity: 0.15
  font_size: 14
  rotation: -30           # degrees
  color: "150,150,150"    # rgb
  cdn_url: ""             # serve the watermark JS from your own CDN
  report_webhook: ""      # optional: POST {slug,user,ua,ts} per page view

# ── server ───────────────────────────────────────────────────────────────────
server:
  host: 0.0.0.0
  port: 8787
  public_base: ""         # e.g. https://pages.example.com — used in printed URLs

# ── admin portal (M5) ────────────────────────────────────────────────────────
admin:
  admins: []              # superadmin emails, e.g. [ops@example.com]
  # audit.log size rotation (M6): rotate to audit.log.1/.2/... when the
  # current file exceeds audit_max_bytes; keep audit_keep archives.
  # 0 disables rotation. env: GOLIVE_AUDIT_MAX_BYTES / GOLIVE_AUDIT_KEEP.
  audit_max_bytes: 10485760   # 10 MB
  audit_keep: 5
                          # env GOLIVE_ADMINS=a@x.com,b@x.com overrides this list

# ── slug rules ───────────────────────────────────────────────────────────────
slug:
  reserved: []            # extra reserved slugs, e.g. [internal, beta]

# ── resource localization ────────────────────────────────────────────────────
localize:
  never: []               # extra never-localize domains

# ── security scanning ────────────────────────────────────────────────────────
security:
  extra_rules: []         # extra rule YAML files, same schema as built-in
  # Optional LLM second-pass review of weak hits (M3). Any OpenAI-compatible
  # Chat Completions endpoint works: OpenAI, Azure OpenAI, Ollama
  # (http://localhost:11434/v1), OneAPI/new-api gateways, vLLM, LM Studio.
  # llm:
  #   base_url: https://api.openai.com/v1
  #   api_key_env: GOLIVE_LLM_API_KEY   # env var holding the key ('' ok for Ollama)
  #   model: gpt-4o-mini
  #   timeout: 20                       # seconds; on timeout rule verdicts stand
  #   strict_mode: false                # true = refuse publish when LLM unset
